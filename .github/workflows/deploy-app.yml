name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip if Cloudflare secrets are not configured
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID no configurados; se omite el deploy."
      - if: env.HAS_CF == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_CF == 'true'
        uses: pnpm/action-setup@v6
      - if: env.HAS_CF == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CF == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_CF == 'true'
        run: pnpm build
        env:
          NUXT_PUBLIC_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config deploy/app/wrangler.jsonc
