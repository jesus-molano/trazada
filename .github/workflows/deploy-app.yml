name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip if Cloudflare secrets are not configured
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID no configurados; se omite el deploy."
      - if: env.HAS_CF == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_CF == 'true'
        uses: pnpm/action-setup@v6
      - if: env.HAS_CF == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CF == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_CF == 'true'
        run: pnpm build
        env:
          NUXT_PUBLIC_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config deploy/app/wrangler.jsonc
      # Smoke post-deploy: cabeceras de los datos, deep link y que la página se pinta.
      # Requiere las variables del repo APP_URL y DATA_BASE_URL (y datos ya desplegados con pnpm data:deploy).
      - name: Smoke post-deploy (curl)
        id: smoke
        if: env.HAS_CF == 'true' && vars.APP_URL != '' && vars.DATA_BASE_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
          DATA_URL: ${{ vars.DATA_BASE_URL }}
        run: |
          set -o pipefail
          scripts/smoke-deploy.sh "$APP_URL" "$DATA_URL" | tee smoke.log
          echo "session=$(sed -n 's/^sesión: //p' smoke.log)" >> "$GITHUB_OUTPUT"
      - name: Smoke post-deploy (se pinta)
        if: steps.smoke.outcome == 'success'
        env:
          E2E_DEPLOYED_URL: ${{ vars.APP_URL }}
          E2E_DEPLOYED_SESSION: ${{ steps.smoke.outputs.session }}
        run: |
          pnpm --filter @trazada/web exec playwright install --with-deps chromium
          pnpm --filter @trazada/web exec playwright test deployed --project desktop
