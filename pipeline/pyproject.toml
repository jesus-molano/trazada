[project]
name = "trazada-pipeline"
version = "0.1.0"
description = "Pipeline de datos de Trazada: sesiones a ficheros estáticos compactos (TRZB)."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = [
    "fastf1==3.8.3",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "jsonschema>=4.26,<5",
    "typer>=0.27,<1",
]

[project.optional-dependencies]
archive = ["huggingface_hub>=2.2,<3"]

[project.scripts]
trazada = "trazada_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trazada_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: requiere datos completos en data/ o cachés locales (no corre en CI)",
]
addopts = "-m 'not local'"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PD"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
